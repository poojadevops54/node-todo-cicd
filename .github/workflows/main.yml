name: Node Todo CI/CD

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted

    env:
      AWS_REGION: eu-north-1
      ECR_REGISTRY: 577002943781.dkr.ecr.eu-north-1.amazonaws.com
      ECR_REPOSITORY: node/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t node-todo .

      - name: Tag Docker Image
        run: |
          docker tag node-todo:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag node-todo:latest $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push Docker Images
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}