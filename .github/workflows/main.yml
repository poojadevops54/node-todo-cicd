name: Node Todo CI/CD

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4


      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1


      # Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t node-todo .


      # Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag node-todo:latest 577002943781.dkr.ecr.eu-north-1.amazonaws.com/node/app:latest


      # Push image to ECR
      - name: Push Image to ECR
        run: |
          docker push 577002943781.dkr.ecr.eu-north-1.amazonaws.com/node/app:latest
